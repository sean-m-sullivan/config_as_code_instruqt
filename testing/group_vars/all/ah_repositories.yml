---
hub_collection_remotes:
  - name: community
    url: https://galaxy.ansible.com/
    requirements:
      - name: infra.ee_utilities
        version: ">=4.0.0"
      - name: infra.aap_utilities
        version: ">=2.5.2"
      - name: containers.podman
        version: ">=1.13.0"
      - name: community.general
        version: ">=10.4.0"
      - name: infra.aap_configuration
        version: ">=3.1.0"
      - name: awx.awx


hub_collection_repositories:
  - name: community
    description: "description of community repository"
    pulp_labels:
      pipeline: "approved"
    distribution:
      state: present
    remote: community

hub_configuration_collection_repository_sync_async_delay: 5
hub_configuration_collection_repository_sync_async_retries: 150
...
