---
aap_hostname: aap.medina.vaultcrest.com # "{{ 'controller-443-' + lookup('ansible.builtin.env', 'INSTRUQT_PARTICIPANT_ID') + '.env.play.instruqt.com' }}"
aap_username: admin
aap_password: "{{ aap_password }}"
aap_validate_certs: false
aap_request_timeout: 60

# Remove
ah_host: aap.medina.vaultcrest.com
ee_pull_collections_from_hub: false

ee_registry_username: admin
ee_registry_password: "{{ aap_password }}"
ee_registry_dest: "{{ aap_hostname }}/config"

ee_base_registry: "{{ aap_hostname }}"
ee_base_registry_username: "{{ aap_username }}"
ee_base_registry_password: "{{ aap_password }}"
ee_validate_certs: false